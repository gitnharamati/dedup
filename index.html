<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duplicate Finder</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --text: #1b1f24; --muted: #687280; --border: #e2e5ea;
    --accent: #2459d6; --accent-ink: #fff; --accent-soft: #e8eefc;
    --keep: #17703a; --keep-bg: #e8f6ed; --del: #b42318; --del-bg: #fdeceb;
    --warn: #8a5a00; --warn-bg: #fff4dc;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101215; --panel: #181b20; --text: #e5e8ec; --muted: #9199a4; --border: #2a2f36;
      --accent: #5b8cff; --accent-ink: #0b1020; --accent-soft: #1b2440;
      --keep: #5dd38a; --keep-bg: #13261b; --del: #ff7b72; --del-bg: #2d1514;
      --warn: #f5c451; --warn-bg: #2b2210;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body.mode-link li.del .p { text-decoration: none; }
  body.mode-link li.del .pill { color: var(--accent); background: var(--accent-soft);
                                border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--sans); padding-bottom: 88px; }
  header.top { padding: 22px 24px 4px; max-width: 1180px; margin: 0 auto; }
  header.top h1 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
  header.top p { margin: 4px 0 0; color: var(--muted); }
  main { max-width: 1180px; margin: 0 auto; padding: 16px 24px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  label.field { display: block; font-weight: 600; margin-bottom: 6px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=text], select {
    font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border);
    border-radius: 7px; padding: 8px 10px;
  }
  #path { flex: 1 1 360px; font-family: var(--mono); font-size: 14px; }
  button {
    font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border);
    border-radius: 7px; padding: 7px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.danger { background: var(--del); color: #fff; border-color: var(--del); font-weight: 600; }
  button.link { border: none; background: none; color: var(--accent); padding: 2px 4px; font-size: 13px; }
  .progress { margin-top: 12px; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
  .bar { flex: 0 0 240px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; position: relative; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  .bar.indet > div { width: 30%; position: absolute; animation: slide 1.1s infinite ease-in-out; }
  @keyframes slide { from { left: -30%; } to { left: 100%; } }
  .msg { margin-top: 12px; padding: 10px 12px; border-radius: 7px; font-size: 14px; }
  .msg.err { background: var(--del-bg); color: var(--del); }
  .msg.ok { background: var(--keep-bg); color: var(--keep); }
  .msg.warn { background: var(--warn-bg); color: var(--warn); }
  .msg details { margin-top: 6px; } .msg pre { white-space: pre-wrap; margin: 6px 0 0; font: 12px var(--mono); }

  .summary { margin: 18px 0 10px; display: flex; gap: 18px; flex-wrap: wrap; align-items: baseline; }
  .summary .big { font-size: 20px; font-weight: 650; }
  .summary .muted { color: var(--muted); }
  .toolbar { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar .lbl { color: var(--muted); font-size: 13px; }
  #filter { width: 240px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; }
  .seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  .grp { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
  .grp.bad { border-color: var(--del); }
  .grp > header { padding: 9px 14px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
                  border-bottom: 1px solid var(--border); font-size: 14px; }
  .grp .gid { color: var(--muted); font-variant-numeric: tabular-nums; }
  .grp .hash { color: var(--muted); font: 12px var(--mono); }
  .warnTag { color: var(--del); font-weight: 600; font-size: 13px; }
  .grp ul { list-style: none; margin: 0; padding: 0; }
  .grp li { display: grid; grid-template-columns: 86px 1fr auto auto; gap: 12px; align-items: center;
            padding: 7px 14px; border-top: 1px solid var(--border); cursor: pointer; }
  .grp li:first-child { border-top: none; }
  .grp li:hover { background: var(--bg); }
  .pill { font-size: 12px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; text-align: center;
          border-radius: 999px; padding: 3px 0; border: 1px solid transparent; }
  li.keep .pill { color: var(--keep); background: var(--keep-bg); border-color: color-mix(in srgb, var(--keep) 35%, transparent); }
  li.del .pill { color: var(--del); background: var(--del-bg); border-color: color-mix(in srgb, var(--del) 35%, transparent); }
  li.del .p { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--del) 60%, transparent); }
  .p { font: 13px var(--mono); overflow-wrap: anywhere; min-width: 0; }
  .p .dir { color: var(--muted); } .p .name { font-weight: 600; }
  .date { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .more { display: block; margin: 12px auto; }

  #textView pre { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px;
                  font: 12.5px/1.5 var(--mono); white-space: pre; overflow: auto; max-height: 70vh; margin: 8px 0 0; }

  footer.actions { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--border);
                   padding: 12px 24px; display: flex; gap: 16px; align-items: center; justify-content: flex-end; flex-wrap: wrap;
                   box-shadow: 0 -4px 16px rgba(0,0,0,.06); }
  footer.actions #selInfo { margin-right: auto; font-weight: 600; }
  footer.actions label { font-size: 14px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  code { font-family: var(--mono); font-size: .92em; }

  dialog { border: 1px solid var(--border); border-radius: 12px; background: var(--panel); color: var(--text);
           padding: 20px; width: min(640px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h2 { margin: 0 0 8px; font-size: 18px; }
  dialog ul { font: 12.5px var(--mono); max-height: 220px; overflow: auto; padding-left: 18px; color: var(--muted); }
  dialog .row { justify-content: flex-end; margin-top: 16px; }

  @media (max-width: 700px) {
    main, header.top { padding-left: 16px; padding-right: 16px; }
    .grp li { grid-template-columns: 70px 1fr; }
    .grp li .date, .grp li .only { grid-column: 2; }
    .bar { flex-basis: 120px; }
    #filter { width: 100%; }
  }
</style>
</head>
<body>
<header class="top">
  <h1>Duplicate Finder</h1>
  <p>Finds files with identical content. Nothing is changed on disk until you confirm.</p>
</header>

<main>
  <section class="panel">
    <form id="scanForm" autocomplete="off">
      <label class="field" for="path">Folder to scan</label>
      <div class="row">
        <input type="text" id="path" spellcheck="false" required
               placeholder="C:\Users\you\Pictures   or   /home/you/Pictures">
        <select id="minSize" title="Ignore small files">
          <option value="1">All files</option>
          <option value="1024">1 KB and up</option>
          <option value="102400">100 KB and up</option>
          <option value="1048576">1 MB and up</option>
        </select>
        <button class="primary" id="scanBtn" type="submit">Scan</button>
        <button id="cancelBtn" type="button" hidden>Cancel</button>
      </div>
    </form>
    <div class="progress" id="progress" hidden>
      <div class="bar" id="bar"><div id="barFill"></div></div>
      <span id="progressText"></span>
    </div>
    <div id="message" hidden></div>
  </section>

  <section id="results" hidden>
    <div class="summary" id="summary"></div>
    <div class="toolbar">
      <div class="row">
        <span class="lbl">Keep one copy per set:</span>
        <button data-keep="oldest">Oldest</button>
        <button data-keep="newest">Newest</button>
        <button data-keep="shortest">Shortest path</button>
        <button data-keep="all">Keep all</button>
      </div>
      <div class="row">
        <input type="text" id="filter" placeholder="Filter by path…" spellcheck="false">
        <div class="seg" role="tablist">
          <button data-view="groups" class="on">Sets</button>
          <button data-view="text">Text</button>
        </div>
      </div>
    </div>
    <div id="groupsView"></div>
    <div id="textView" hidden>
      <div class="row">
        <button id="copyText">Copy</button>
        <button id="dlText">Download .txt</button>
        <span class="lbl" style="color:var(--muted);font-size:13px">Reflects your current keep / delete choices.</span>
      </div>
      <pre id="reportText"></pre>
    </div>
  </section>
</main>

<footer class="actions" id="actionBar" hidden>
  <span id="selInfo"></span>
  <label for="actionMode">Marked files:
    <select id="actionMode">
      <option value="delete">Delete permanently</option>
      <option value="move">Move to dups folder</option>
      <option value="link">Replace with hard link</option>
    </select>
  </label>
  <button class="danger" id="applyBtn">Delete selected</button>
</footer>

<dialog id="confirm">
  <h2 id="cTitle"></h2>
  <p id="cBody"></p>
  <ul id="cList"></ul>
  <div class="row">
    <button id="cCancel" type="button">Cancel</button>
    <button class="danger" id="cOk" type="button"></button>
  </div>
</dialog>

<script>window.DEDUP = __CONFIG__;</script>
<script>
(() => {
  const CFG = window.DEDUP;
  const $ = (id) => document.getElementById(id);
  const PAGE = 150;

  let data = null;            // scan result from the server
  let marked = new Set();     // paths marked for deletion
  let byId = new Map();
  let shown = PAGE;
  let view = 'groups';
  let pollTimer = null;

  // ------------------------------------------------------------ helpers
  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function fmtSize(n) {
    const u = ['B','KB','MB','GB','TB']; let i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return i === 0 ? `${n} B` : `${n.toFixed(1)} ${u[i]}`;
  }
  function fmtDate(t) {
    const d = new Date(t * 1000), p = (x) => String(x).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  function splitPath(p) {
    const i = Math.max(p.lastIndexOf('/'), p.lastIndexOf('\\'));
    return { dir: p.slice(0, i + 1), name: p.slice(i + 1) };
  }
  async function api(method, url, body) {
    const r = await fetch(url, {
      method, headers: { 'X-Token': CFG.token, 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined,
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `${r.status} ${r.statusText}`);
    return j;
  }
  function message(kind, html) {
    const m = $('message');
    if (!kind) { m.hidden = true; return; }
    m.className = `msg ${kind}`; m.innerHTML = html; m.hidden = false;
  }
  const groupFullyMarked = (g) => g.files.every(f => marked.has(f.path));
  const MODES = {
    delete: { pill: 'Delete', tag: '[DELETE]', button: 'Delete selected',          ok: 'Delete files', done: 'Deleted' },
    move:   { pill: 'Move',   tag: '[MOVE]  ', button: 'Move selected to dups',    ok: 'Move files',   done: 'Moved' },
    link:   { pill: 'Link',   tag: '[LINK]  ', button: 'Replace with hard links',  ok: 'Replace with links', done: 'Replaced with hard links:' },
  };
  const mode = () => $('actionMode').value;

  // ------------------------------------------------------------ scanning
  $('scanForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    message(null);
    try {
      const r = await api('POST', '/api/scan', { path: $('path').value, min_size: +$('minSize').value });
      $('path').value = r.root;
      try { localStorage.setItem('dedup.path', r.root); } catch (_) {}
      setScanning(true);
      poll();
    } catch (err) { message('err', esc(err.message)); }
  });
  $('cancelBtn').addEventListener('click', () => api('POST', '/api/cancel').catch(() => {}));

  function setScanning(on) {
    $('scanBtn').disabled = on; $('path').disabled = on; $('minSize').disabled = on;
    $('cancelBtn').hidden = !on; $('progress').hidden = !on;
    if (on) { $('results').hidden = true; $('actionBar').hidden = true; }
  }

  async function poll() {
    clearTimeout(pollTimer);
    let s;
    try { s = await api('GET', '/api/status'); }
    catch (err) { setScanning(false); message('err', esc(err.message)); return; }
    if (s.state === 'running') {
      const bar = $('bar');
      if (s.total) {
        bar.classList.remove('indet');
        $('barFill').style.width = `${Math.min(100, 100 * s.done / s.total).toFixed(1)}%`;
        $('progressText').textContent = `${s.phase}: ${s.done.toLocaleString()} / ${s.total.toLocaleString()}`;
      } else {
        bar.classList.add('indet');
        $('progressText').textContent = `${s.phase}: ${s.done.toLocaleString()} files`;
      }
      pollTimer = setTimeout(poll, 400);
      return;
    }
    setScanning(false);
    if (s.state === 'error') { message('err', esc(s.error)); return; }
    if (s.state === 'done') { await loadResult(); return; }
    if (s.phase === 'Cancelled') message('warn', 'Scan cancelled.');
  }

  async function loadResult() {
    data = await api('GET', '/api/result');
    if (!data.groups) return;
    autoSelect('oldest');
    shown = PAGE;
    if (data.errors && data.errors.length) {
      message('warn', `${data.errors.length} item(s) could not be read and were skipped.
        <details><summary>Show</summary><pre>${esc(data.errors.slice(0, 500).join('\n'))}</pre></details>`);
    }
    render();
  }

  // ------------------------------------------------------------ selection
  function autoSelect(strategy) {
    marked = new Set();
    if (strategy === 'all') return;
    for (const g of data.groups) {
      const keyOf = {
        oldest:   f => [f.mtime, f.path.length],
        newest:   f => [-f.mtime, f.path.length],
        shortest: f => [f.path.length, f.mtime],
      }[strategy];
      let best = g.files[0];
      for (const f of g.files) {
        const a = keyOf(f), b = keyOf(best);
        if (a[0] < b[0] || (a[0] === b[0] && a[1] < b[1])) best = f;
      }
      for (const f of g.files) if (f !== best) marked.add(f.path);
    }
  }
  document.querySelectorAll('[data-keep]').forEach(b => b.addEventListener('click', () => {
    autoSelect(b.dataset.keep); render();
  }));

  $('groupsView').addEventListener('click', (e) => {
    if (e.target.id === 'moreBtn') { shown += PAGE; renderGroups(); return; }
    const li = e.target.closest('li[data-path]');
    if (!li) return;
    const path = li.dataset.path;
    const g = byId.get(+li.closest('.grp').dataset.id);
    if (e.target.classList.contains('only')) {
      for (const f of g.files) f.path === path ? marked.delete(f.path) : marked.add(f.path);
    } else {
      marked.has(path) ? marked.delete(path) : marked.add(path);
    }
    li.closest('.grp').outerHTML = groupHTML(g);
    updateSelection();
  });

  // ------------------------------------------------------------ rendering
  function visibleGroups() {
    const q = $('filter').value.trim().toLowerCase();
    return q ? data.groups.filter(g => g.files.some(f => f.path.toLowerCase().includes(q))) : data.groups;
  }

  function groupHTML(g) {
    const bad = groupFullyMarked(g);
    const rows = g.files.map(f => {
      const del = marked.has(f.path), { dir, name } = splitPath(f.path);
      return `<li class="${del ? 'del' : 'keep'}" data-path="${esc(f.path)}" title="Click to toggle keep / ${MODES[mode()].pill.toLowerCase()}">
        <span class="pill">${del ? MODES[mode()].pill : 'Keep'}</span>
        <span class="p"><span class="dir">${esc(dir)}</span><span class="name">${esc(name)}</span></span>
        <span class="date">${fmtDate(f.mtime)}</span>
        <button class="link only" type="button">Keep only this</button>
      </li>`;
    }).join('');
    return `<article class="grp${bad ? ' bad' : ''}" data-id="${g.id}">
      <header><span class="gid">#${g.id}</span><b>${g.files.length} copies</b>
        <span>${fmtSize(g.size)} each</span><span class="hash">${g.hash.slice(0, 12)}</span>
        ${bad ? '<span class="warnTag">Every copy is marked — keep at least one</span>' : ''}
      </header><ul>${rows}</ul></article>`;
  }

  function renderGroups() {
    const groups = visibleGroups();
    let html = groups.slice(0, shown).map(groupHTML).join('');
    if (groups.length > shown) html += `<button class="more" id="moreBtn">Show more (${(groups.length - shown).toLocaleString()} left)</button>`;
    if (!groups.length) html = `<p style="color:var(--muted)">${data.groups.length ? 'No sets match the filter.' : 'No duplicates found.'}</p>`;
    $('groupsView').innerHTML = html;
  }

  function buildText() {
    const g = data.groups;
    const files = g.reduce((n, x) => n + x.files.length, 0);
    const reclaim = g.reduce((n, x) => n + x.size * (x.files.length - 1), 0);
    const sel = selectionStats();
    const out = [
      'DUPLICATE FILES REPORT',
      `Folder scanned : ${data.root}`,
      `Scanned at     : ${data.scanned_at}`,
      `Files scanned  : ${data.files_scanned.toLocaleString()}`,
      `Duplicate sets : ${g.length.toLocaleString()}  (${files.toLocaleString()} files, ${fmtSize(reclaim)} reclaimable)`,
      `Marked ${MODES[mode()].pill.toLowerCase().padEnd(8)}: ${sel.count.toLocaleString()} files (${fmtSize(sel.bytes)})`,
      '',
    ];
    for (const x of g) {
      out.push(`=== Set ${x.id}: ${x.files.length} copies x ${fmtSize(x.size)}  (sha256 ${x.hash.slice(0, 16)}) ===`);
      for (const f of x.files) {
        out.push(`  ${marked.has(f.path) ? MODES[mode()].tag : '[KEEP]  '}  ${f.path}   (modified ${fmtDate(f.mtime)})`);
      }
      out.push('');
    }
    return out.join('\n');
  }

  function selectionStats() {
    let count = 0, bytes = 0, bad = 0;
    for (const g of data.groups) {
      for (const f of g.files) if (marked.has(f.path)) { count++; bytes += g.size; }
      if (groupFullyMarked(g)) bad++;
    }
    return { count, bytes, bad };
  }

  function updateSelection() {
    const s = selectionStats();
    $('selInfo').textContent = s.count
      ? `${s.count.toLocaleString()} file(s) marked · ${fmtSize(s.bytes)}`
      : 'No files marked';
    $('applyBtn').textContent = MODES[mode()].button;
    document.body.classList.toggle('mode-link', mode() === 'link');
    $('applyBtn').disabled = !s.count || s.bad > 0;
    $('applyBtn').title = s.bad ? `${s.bad} set(s) have every copy marked. Keep at least one in each.` : '';
    if (view === 'text') $('reportText').textContent = buildText();
  }

  function render() {
    byId = new Map(data.groups.map(g => [g.id, g]));
    const g = data.groups;
    const files = g.reduce((n, x) => n + x.files.length, 0);
    const reclaim = g.reduce((n, x) => n + x.size * (x.files.length - 1), 0);
    $('summary').innerHTML = g.length
      ? `<span class="big">${g.length.toLocaleString()} duplicate sets</span>
         <span>${files.toLocaleString()} files · ${fmtSize(reclaim)} reclaimable</span>
         <span class="muted">in ${esc(data.root)} · ${data.files_scanned.toLocaleString()} files scanned</span>`
      : `<span class="big">No duplicates</span><span class="muted">${data.files_scanned.toLocaleString()} files scanned in ${esc(data.root)}</span>`;
    $('results').hidden = false;
    $('actionBar').hidden = !g.length;
    renderGroups();
    updateSelection();
  }

  $('filter').addEventListener('input', () => { shown = PAGE; renderGroups(); });
  document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
    view = b.dataset.view;
    document.querySelectorAll('[data-view]').forEach(x => x.classList.toggle('on', x === b));
    $('groupsView').hidden = view !== 'groups';
    $('textView').hidden = view !== 'text';
    if (view === 'text') $('reportText').textContent = buildText();
  }));
  $('copyText').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(buildText()); $('copyText').textContent = 'Copied'; }
    catch (_) { $('copyText').textContent = 'Copy failed'; }
    setTimeout(() => $('copyText').textContent = 'Copy', 1500);
  });
  $('dlText').addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([buildText()], { type: 'text/plain' }));
    a.download = 'duplicates.txt'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  $('actionMode').addEventListener('change', () => {
    try { localStorage.setItem('dedup.mode', mode()); } catch (_) {}
    if (data) { renderGroups(); updateSelection(); }
  });

  // ------------------------------------------------------------ apply
  $('applyBtn').addEventListener('click', () => {
    const s = selectionStats(), m = mode();
    const paths = [...marked], n = s.count.toLocaleString();
    $('cTitle').textContent = {
      delete: `Permanently delete ${n} file(s)?`,
      move:   `Move ${n} file(s) to the dups folder?`,
      link:   `Replace ${n} file(s) with hard links?`,
    }[m];
    $('cBody').innerHTML = {
      delete: `This frees ${fmtSize(s.bytes)}. Deleted files do <b>not</b> go to the Recycle Bin / Trash and cannot be recovered.`,
      move:   `They'll be moved to <code>${esc(CFG.dupsDir)}</code> with their source folder added to the name (${fmtSize(s.bytes)}). Run <code>python dedup.py --restore</code> to undo.`,
      link:   `Each file stays at its path but becomes a hard link to a kept copy in its set, freeing ${fmtSize(s.bytes)}.
               Afterwards the paths share one copy of the data: <b>editing any of them changes all of them</b>.
               Linked files take the kept copy's modified date. Files must be on the same drive as the kept copy
               (NTFS, ext4, APFS… — not FAT32/exFAT); others are skipped and listed.`,
    }[m];
    $('cList').innerHTML = paths.slice(0, 12).map(p => `<li>${esc(p)}</li>`).join('') +
      (paths.length > 12 ? `<li>…and ${(paths.length - 12).toLocaleString()} more</li>` : '');
    $('cOk').textContent = MODES[m].ok;
    $('confirm').showModal();
  });
  $('cCancel').addEventListener('click', () => $('confirm').close());
  $('cOk').addEventListener('click', async () => {
    $('confirm').close();
    const m = mode(), move = m === 'move';
    $('applyBtn').disabled = true;
    try {
      const r = await api('POST', '/api/apply', { paths: [...marked], mode: m });
      const ok = r.results.filter(x => x.ok), bad = r.results.filter(x => !x.ok);
      data.groups = r.groups;
      const still = new Set(r.groups.flatMap(g => g.files.map(f => f.path)));
      marked = new Set([...marked].filter(p => still.has(p) && !ok.some(x => x.path === p)));
      let html = `${MODES[m].done} ${ok.length.toLocaleString()} file(s), freeing ${fmtSize(r.freed)}.`;
      if (move && ok.length) html += ` Files are in <code>${esc(r.dups_dir)}</code>.`;
      if (bad.length) html += `<details open><summary>${bad.length} failed</summary><pre>${esc(bad.map(x => `${x.path}  —  ${x.error}`).join('\n'))}</pre></details>`;
      message(bad.length ? 'warn' : 'ok', html);
      render();
    } catch (err) {
      message('err', esc(err.message));
      updateSelection();
    }
  });

  // ------------------------------------------------------------ start
  try { const p = localStorage.getItem('dedup.path'); if (p) $('path').value = p; } catch (_) {}
  try { const m = localStorage.getItem('dedup.mode'); if (MODES[m]) $('actionMode').value = m; } catch (_) {}
  api('GET', '/api/status').then(s => {
    if (s.state === 'running') { setScanning(true); poll(); }
    else if (s.state === 'done' && s.has_result) loadResult();
  }).catch(() => {});
})();
</script>
</body>
</html>
